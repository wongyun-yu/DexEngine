# Canonical UrdfConverter settings of the DexEngine robot USD generation.
# Vendored from an Isaac Lab asset's UrdfConverter config (isaaclab_assets data/Robots/<arm + Inspire RH56F1>/config.yaml)
# (recorded at 2026-01-27 16:05:46). These settings were used to produce the currently
# committed USDs under data/usd_cache/robots/{floating_hand,full_robot}/. Do not modify without
# regenerating and verifying all downstream USDs.

force_usd_conversion: true
make_instanceable: true
fix_base: true
root_link_name: null
link_density: 0.0
merge_fixed_joints: true
convert_mimic_joints_to_normal_joints: false
joint_drive:
  drive_type: force
  target_type: position
  gains:
    stiffness: 100.0
    damping: 1.0
collider_type: convex_hull
self_collision: false
replace_cylinders_with_capsules: false
collision_from_visuals: false
