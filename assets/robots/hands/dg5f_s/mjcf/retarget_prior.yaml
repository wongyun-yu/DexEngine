# Tesollo DG-5F-S (spec dir `dg5f_s`) retargeting posture prior — writes **the chain topology only**.
#
# Template v2. The numbers are owned by `ik.PRIOR_TEMPLATE` alone, and the
# overrides here (`overrides:`) are **only the two abduction-limit avoidance terms** (A/B on 50 clips:
# abduction saturation 215→9 (joint×clip) · saturated clips 50/50→9/50 · cost fingertip Δp50 0.75 mm).
# The gate uses an **absolute threshold**, not a comparison with wuji.
# Schema: the `ik.build_prior_conf` docstring (not repeated here).
#
# ⚠ In v2 the only rule this hand gets is **the joint-limit cut**.
#   The synergy · mcp-share springs and the abduction penalty went to 0 in the template default (they would remove
#   the advantage of a high-DoF hand). Do **not copy** wuji's `overrides:` block here.
#
# Why the cut is needed: on DG-5F-S every PIP/DIP (joint_F_3 / joint_F_4) and the little MCP (joint_5_3) is
# [-90°, +90°], so an IK that only matches fingertips can pick the **hyperextension (zigzag) branch** — as wuji did
# before its prior. Outputs run without a prior had fingertip p95 14.08 mm (wuji 6.30)
# · palm 17.3 mm.
#
# ── v2 cut, measured (rig FK; `sign` gives the bending direction) ───────────────────────────
# Template v2 cuts up to the mcp, but **only the side opposite to bending**. On this hand the joints that actually narrow
# are **only the little MCPs of both hands** — the other MCPs are already one-sided and do not change:
#   · index·middle·ring MCP joint_F_2 = [0°,126/130/127°] · sign +1 → lower max(0,0)=0, **unchanged**
#   · thumb MCP right right_joint_1_2 = [-153°,0] · sign −1 → upper min(0,0)=0, **unchanged**
#     left left_joint_1_2 = [0,153°] · sign +1 → **unchanged**
#   · little MCP joint_5_3 = [-90°,+90°] · sign +1 → **narrows to [0°,+90°] (both hands)**
#
# ── roles and signs **re-verified** with URDF fingertip FK ────────────────────
# Tool: data/_stage/dg5f_s/urdf/dg5fs_{side}_w_mount.urdf, move one joint by +0.2 rad and measure the fingertip displacement.
# Reference frame (link_base): the fingers extend along +z, and **the palm side = +x**.
#   (Check: the one-sided MCP joint_F_2 [0°,126°] moves the fingertip by 16.85 mm along +x.)
# Fingers 2–4 (index·middle·ring), same on both hands:
#   joint_F_1 → fingertip Δy −21.65 mm  = abduction
#   joint_F_2 → Δx +16.85 mm       = MCP flexion, + = flexion
#   joint_F_3 → Δx +10.21 mm       = PIP flexion, + = flexion
#   joint_F_4 → Δx  +3.58 mm       = DIP flexion, + = flexion
# Little (F=5): joint_5_1 Δx +4.86 mm = **palm arch** (range [0°,60°], left [−60°,0°]) →
#   bound to neutral by the abduction term, not the flexion chain · joint_5_2 Δy −17.78 mm = abduction ·
#   joint_5_3 Δx +12.38 mm = MCP · joint_5_4 Δx +5.74 mm = distal. **There is no dip** (2-joint chain).
# Thumb (F=1): joint_1_1 is Δz (right +19.95 / left −19.95) = opposition swing → abduction term.
#   Right joint_1_2 is Δx **−19.95 mm** (away from the palm) with range [−153°, 0°], so **flexion is negative** (sign −1).
#   Right joint_1_3/1_4 are Δz +12.38 / +5.74 mm = curling toward the fingers → sign +1.
#   On the left, joint_1_2 has range [0°, 153°] and Δx +19.95 mm → sign +1, joint_1_3/1_4 are Δz −12.38 / −5.74
#   mm (away from the fingers) → **sign −1**. So only the thumb differs in sign between sides — fingers 2–5 are the same.
#
# ── little MCP sign fixed by rig FK **on each hand** ──
# Method (derived again from the rig, not looked up in a table): the index·middle·ring MCPs `joint_F_2` have the
# one-sided range [0,+], so **+ is flexion by definition**. Averaging the unit vectors of their fingertip displacements gives
# that rig's bending direction n̂, and the little MCP displacement is projected onto n̂. Measured on each of the two rigs.
#   right n̂ = (-0.9950, +0.0998, ~0) · fingers 2–4 +0.2 rad → (-16.85, +1.69, 0) mm (mutual dot of the three = 1.000)
#     right_joint_5_3 +90° → (-62.30, +62.30, 0) mm · d·n̂ = **+68.21 mm (palm)**
#                     −90° → (+62.30, +62.30, 0) mm · d·n̂ = **−55.77 mm (back of the hand)**
#   left n̂ = (-0.9950, +0.0998, ~0) · fingers 2–4 +0.2 rad → (-16.85, +1.69, 0) mm (mutual dot of the three = 1.000)
#     left_joint_5_3  +90° → (-62.30, +62.30, 0) mm · d·n̂ = **+68.21 mm (palm)**
#                     −90° → (+62.30, +62.30, 0) mm · d·n̂ = **−55.77 mm (back of the hand)**
# Conclusion: **+ is toward the palm on both hands** (sign +1, the chain below as it is). The range is not mirrored but
# symmetric [-90°,90°] on both hands, so the kept side is the same too — **right [0°,90°] · left [0°,90°]**.
# (Mirrored joints exist elsewhere: joint_5_1 right [0,60°] ↔ left [-60°,0], thumb joint_1_2 right
#  [-153°,0] ↔ left [0,153°]. That is why "the left is surely the mirror" was measured, not assumed.)
# The same loop checks the little distal joint_5_4: + is toward the palm on both hands (right·left d·n̂ = +31.64 mm @ +90°) —
# matching the chain's sign +1; this joint has been cut as pip since v1.
#
# Known quirks (kept as they are; not changed silently here):
#   (1) On the thumb the MCP moves the fingertip along x and PIP/DIP along z (orthogonal). v1's `pip ≈ 1.30·mcp`
#       mcp-share spring **tied two orthogonal motions together**; in v2 that spring is off
#       (λ=0), so it no longer acts on this hand. Revisit when it is turned back on.
#   (2) In v2 the abduction penalty is 0, so the joints listed under `abd:` (including the little palm arch joint_5_1)
#       **get no spring at all**. The chain declaration stays as the record of the contact columns and topology.
#   (3) The joint names were checked against **the generator's prefix rule**, as the rig (MJCF) did not exist yet
#       (the rig generator: a name not starting with `<side>_` gets it) — URDF `joint_1_2` → `right_joint_1_2`.
#       Once the rig exists, `_resolve` checks all 20 names on the first run (it dies when one is missing).

schema: 1
template: v2-20260922
enabled: true
# Abduction-limit avoidance (one-sided barrier): only when a joint comes within limit_margin_deg of its limit, τ=−λ·(q−(lim∓m)); 0 in the middle.
# The existing lambda_abduction (neutral spring) is not turned on. Target roles = the template default (abduction of fingers 2–5).
overrides:
  lambda_limit_avoid: 30
  limit_margin_deg: 5

chains:
  right:
    thumb:
      mcp: {joint: right_joint_1_2, sign: -1.0}   # range [-153°,0] · flexion negative
      pip: {joint: right_joint_1_3, sign: 1.0}
      dip: {joint: right_joint_1_4, sign: 1.0}
      abd: [right_joint_1_1]                      # CMC opposition swing
    index:
      mcp: {joint: right_joint_2_2, sign: 1.0}
      pip: {joint: right_joint_2_3, sign: 1.0}
      dip: {joint: right_joint_2_4, sign: 1.0}
      abd: [right_joint_2_1]
    middle:
      mcp: {joint: right_joint_3_2, sign: 1.0}
      pip: {joint: right_joint_3_3, sign: 1.0}
      dip: {joint: right_joint_3_4, sign: 1.0}
      abd: [right_joint_3_1]
    ring:
      mcp: {joint: right_joint_4_2, sign: 1.0}
      pip: {joint: right_joint_4_3, sign: 1.0}
      dip: {joint: right_joint_4_4, sign: 1.0}
      abd: [right_joint_4_1]
    pinky:                                        # 2-joint chain — no dip
      mcp: {joint: right_joint_5_3, sign: 1.0}
      pip: {joint: right_joint_5_4, sign: 1.0}
      abd: [right_joint_5_2, right_joint_5_1]     # abduction · palm arch
  left:
    thumb:
      mcp: {joint: left_joint_1_2, sign: 1.0}     # range [0,153°] · flexion positive
      pip: {joint: left_joint_1_3, sign: -1.0}    # curl is −z
      dip: {joint: left_joint_1_4, sign: -1.0}
      abd: [left_joint_1_1]
    index:
      mcp: {joint: left_joint_2_2, sign: 1.0}
      pip: {joint: left_joint_2_3, sign: 1.0}
      dip: {joint: left_joint_2_4, sign: 1.0}
      abd: [left_joint_2_1]
    middle:
      mcp: {joint: left_joint_3_2, sign: 1.0}
      pip: {joint: left_joint_3_3, sign: 1.0}
      dip: {joint: left_joint_3_4, sign: 1.0}
      abd: [left_joint_3_1]
    ring:
      mcp: {joint: left_joint_4_2, sign: 1.0}
      pip: {joint: left_joint_4_3, sign: 1.0}
      dip: {joint: left_joint_4_4, sign: 1.0}
      abd: [left_joint_4_1]
    pinky:
      mcp: {joint: left_joint_5_3, sign: 1.0}
      pip: {joint: left_joint_5_4, sign: 1.0}
      abd: [left_joint_5_2, left_joint_5_1]
