[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexengine"
version = "0.1.0"
requires-python = ">=3.10"
description = "DexEngine: scaling human hand-object demonstrations into physically executable whole-robot data."
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
# Stage 1 retargeting and the CPU half of stage 2 (MuJoCo, pinocchio, mesh tools).
retarget = [
    "numpy==2.3.5",
    "torch==2.9.1",
    "scipy==1.16.3",
    # The recorded retargeting runs used a development build (3.4.1.dev861077626, configs/env/retarget_requirements.txt)
    # that no package index serves. 3.4.0 is the nearest release (next: 3.5.0): every module-level mujoco name the code
    # uses resolves in it, the committed rigs compile to the same sizes and forward kinematics, and hand_rig --dry-run
    # prints the same report as with the development build. Retargeting outputs were not regenerated under it.
    "mujoco==3.4.0",
    # The f0 GPU engine (dexengine/retarget/f0/gpu_kernels.py) imports warp under the retargeting interpreter. The
    # recorded retargeting runs used a development build (1.11.0.dev20251120, configs/env/retarget_requirements.txt)
    # that PyPI does not serve; 1.11.0 is the release it precedes. Under 1.11.0 the f0 kernel modules and mujoco-warp
    # at the commit below import; the kernels were not compiled or run with it, and retargeting outputs were not
    # regenerated under it. mujoco-warp requires warp-lang>=1.9.1 with no upper bound and imports warp.context, which
    # 1.19.0 no longer ships, so this pin is what keeps pip on a working release.
    "warp-lang==1.11.0",
    # The same commit as the isaac extra (the cross-repair GPU filter, dexengine/placement/repair/xr_kernels.py); the
    # recorded retargeting environment carries it.
    "mujoco-warp @ git+https://github.com/google-deepmind/mujoco_warp@dde89450a160ad0ccd12c6b95ff4ca88ccc723ee",
    # Step 4 (D24, dexengine/data/objects/hull.py) reads object USDs with pxr under the retargeting interpreter; the
    # same pin as the isaac extra and the recorded retargeting environment.
    "usd-core==25.11",
    # The canonical CoACD decomposition (dexengine/retarget/decompose) checks its OpenMP pool with threadpoolctl; the
    # recorded retargeting environment has 3.6.0 (there as a scikit-learn dependency).
    "threadpoolctl==3.6.0",
    "loguru==0.7.3",
    "tyro==0.9.35",
    "loop-rate-limiters==1.2.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "pyyaml==6.0.3",
    "matplotlib==3.10.7",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "pymeshlab==2025.7",
    "trimesh==4.9.0",
    "coacd==1.0.7",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "pillow==12.0.0",
    # The stage-4 `assets` tool (dexengine/record/looks/augvis/assets.py, run by scripts/stage4_record.py under this
    # interpreter) reads HDRIs with cv2; the version of the recorded retargeting environment.
    "opencv-python==4.11.0.86",
    "open3d==0.19.0",
    "smplx==0.1.28",
    "pin==4.0.0",
    "chumpy @ git+https://github.com/mattloper/chumpy.git@580566eafc9ac68b2614b64d6f7aaa84eebb70da",
]
# Extra packages on top of an Isaac Lab environment (RL, placement judge, IK pool, USD bake, bake server).
isaac = [
    "usd-core==25.11",
    "mujoco==3.4.0",
    "mujoco-warp @ git+https://github.com/google-deepmind/mujoco_warp@dde89450a160ad0ccd12c6b95ff4ca88ccc723ee",
    "coacd==1.0.7",
    "pytorch-kinematics==0.10.0",
]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["dexengine*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C90", "SIM", "RET", "B", "BLE", "PERF", "C4", "PIE"]
ignore = [
    "E402", "RET504", "RET505", "SIM102", "SIM103", "SIM108", "SIM117", "UP006",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Bare names are the vulture whitelist format: each line marks one name as used.
"tools_vulture_whitelist.py" = ["B018"]
# Byte-pinned: its sha256 is part of the stage-2e input fingerprint (placement/repair/wrist_desk_fresh.input_fp), so a
# refactor of build_prior_conf would change the fingerprint of every stage-2e output.
"dexengine/retarget/ik/prior.py" = ["C901"]
# zip() sites without strict= kept as they are.
"dexengine/placement/judge/track.py" = ["B905"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["dexengine", "experiments"]
section-order = ["future", "standard-library", "third-party", "omniverse", "isaaclab", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
omniverse = ["isaacsim", "omni", "pxr", "carb", "usdrt"]
isaaclab = ["isaaclab", "isaaclab_rl", "isaaclab_assets", "isaaclab_tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
